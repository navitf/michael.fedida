<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="מאמר מאת מיכאל פדידה.">
    <title>Article</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="compact">
    <header>
        <h1><a href="index.html">מיכאל פדידה, חיבורים ומאמרים</a></h1>
        <nav>
            <a href="index.html">מאמרים</a>
            <a href="tanach.html">פרשנות תנ"ך</a>
            <a href="about.html">על אודות</a>
        </nav>
    </header>
    <main>
        <div id="article-content"></div>
        <div class="pdf-container">
            <iframe id="pdf-embed" class="pdf-embed" src=""></iframe>
            <div style="text-align: center; margin: 20px 0;">
                <a id="view-link" class="download-link" href="" target="_blank" style="margin-right: 15px;">View PDF</a>
                <a id="download-link" class="download-link" href="" download>Download PDF</a>
            </div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="tanach-data.js"></script>
    <script src="script.js"></script>
    <script src="letters.js"></script>
    <script src="tanach.js"></script>
    <script>
        // Get article ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // Tanach chapters (generated data) take precedence; slugs never overlap.
        const chapter = (typeof findChapter === 'function') ? findChapter(articleId) : null;

        if (chapter) {
            renderChapterPage(chapter);
        } else {
        const article = articles.find(a => a.slug === articleId)
            || ((typeof letters !== 'undefined') ? letters.find(a => a.slug === articleId) : null);

        if (article) {
            document.title = article.title;

            if (article.htmlFile) {
                // Load HTML content from file
                fetch(article.htmlFile)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        return response.text();
                    })
                    .then(html => {
                        document.getElementById('pdf-embed').style.display = 'none';
                        document.getElementById('view-link').style.display = 'none';
                        document.getElementById('download-link').style.display = 'none';
                        document.getElementById('article-content').innerHTML = `
                            <div class="article-text" style="margin-top: 30px; line-height: 1.8;">${html}</div>
                        `;
                    })
                    .catch(error => {
                        console.error('Error loading HTML file:', error);
                        document.getElementById('pdf-embed').style.display = 'none';
                        document.getElementById('view-link').style.display = 'none';
                        document.getElementById('download-link').style.display = 'none';
                        document.getElementById('article-content').innerHTML += `
                            <p>Content not available. Error: ${error.message}</p>
                            <p>Trying to load: ${article.htmlFile}</p>
                        `;
                    });
            } else if (article.content) {
                // Display inline HTML content
                document.getElementById('pdf-embed').style.display = 'none';
                document.getElementById('view-link').style.display = 'none';
                document.getElementById('download-link').style.display = 'none';
                document.getElementById('article-content').innerHTML = `
                    <div class="article-text" style="margin-top: 30px; line-height: 1.8;">${article.content}</div>
                `;
            } else if (article.pdf) {
                // Display PDF with title
                document.getElementById('article-content').innerHTML = `<h2>${article.title}</h2>`;
                document.getElementById('pdf-embed').src = article.pdf;
                document.getElementById('view-link').href = article.pdf;
                document.getElementById('download-link').href = article.pdf;
            }
        }
        }
    </script>
</body>
</html>
